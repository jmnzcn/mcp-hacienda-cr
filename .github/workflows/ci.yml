name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Una vez por semana contra la API real: avisa si Hacienda cambia sus respuestas
  schedule:
    - cron: "0 13 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  live:
    # Contrato con api.hacienda.go.cr y prueba por stdio del servidor compilado
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
      - run: npm run smoke
